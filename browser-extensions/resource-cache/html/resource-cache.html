        btn.fetch   = async function(){
        
              var url   = input.url.value.trim();
              if(!url){
                    log.error('no url given');
                    return;
              }
              
              log('fetching ... ');
              
              var {blob,error}      = await get(url);
              if(error)return;
              
              file    = blob;
              
              url                     = new URL(url);
              var i                   = url.pathname.lastIndexOf('/');
              var name                = url.pathname.slice(i+1);
              input.redirect.value    = name;
              
              log.ok.append();
              
        }//fetch
        
        
        btn.save    = async function(){
        
              var name    = input.redirect.value;
              if(!name){
                    log.error('no redirect filename given');
                    return;
              }
              if(!file){
                    log.error('no file');
                    return;
              }
              
              log('saving',name,'... ');
              
              var {ok,error}    = await send.server.file.save(name,file);
              if(error)return;
              
              log.ok.append();
              
              update.files();

        btn.add   = async function(){
                                                                                console.log('btn.cache');
              log('Add');
              
              var id    = input['rule-id'].value.trim();
              if(id){
                    log('delete existing rule ...');
                    var {ok,error}   = await send.ext.delete(id);
                    if(error){
                          log.error(error);
                    }
                    log.ok.append();
              }else{
                    id    = new_id();
              }
              
              var url;

                    url   = input.url.value.trim();
                    if(!url){
                          log.error('no url given');
                          return;
                    }

              /*
              var regex;
              if(chk.regex.checked){

                          return;
                    }
              }

              if(initiatorDomains){
                    initiatorDomains          = to_arr(initiatorDomains);
              }
              var excludedInitiatorDomains    = input.excluded.value.trim();
              if(excludedInitiatorDomains){
                    excludedInitatorDomains   = to_arr(excludedInitiatorDomains);
              }
              
              log(url);
              
              var hex               = await file_hash(url);
              /*
              var t                 = new URL(url);
              var i                 = t.pathname.lastIndexOf('/');
              var filename          = t.pathname.slice(i+1).replaceAll('.','_');
              filename              = filename+'---'+hex
              */
              var redirect          = $('#redirect').value;
              if(!redirect){
                    log.error('no redirect filename');
                    return;
              }
              
              var server_url        = input.server.value;
              var redirect_url      = server_url+redirect;
              
              var resourceTypes     = resource.read();
              
              var rule    = {
              
                    id,
                    
                    priority    : 1,
                    action      : {
                                        type        : 'redirect',
                                        redirect    : {
                                                            url   : redirect_url
                                                            
                                                            //  \1 captures the dynamic wildcard content from the regexFilter below
                                                            //  and safely appends it to your local server route
                                                            //  url: "http://localhost:3000/proxy?url=\\1"
                                                      }
                                  },
                    condition   : {
                                        urlFilter   : url,
                                        
                                        //  Matches any jsDelivr URL and captures everything after the domain into group 1 (\1)
                                        //  regexFilter: "^https?://cdn\\.jsdelivr\\.net/(.+$)",
                                        
                                        resourceTypes,
                                  }
              }//rule
              
              if(initiatorDomains){
                    rule.condition.initiatorDomains           = initiatorDomains;
              }
              if(excludedInitiatorDomains){
                    rule.condition.excludedInitiatorDomains   = excludedInitiatorDomains;
              }
              
              log.json(rule);
              
/*
              log('fetching ... ');
              var {blob,error}      = await get(url);
              if(error)return;
              log.ok.append();
*/

              log('caching ... ');
              var {error}           = await send.ext.add(rule);
              if(error)return;
              log.ok.append();
              
/*
              var {error}           = await send.server.file.save(filename,blob);
              if(error)return;
*/

              log.ok('successfully cached');
              reset();
              
              update();
              
        }//cache

        send.ext    = function(action,payload={},time=250){
        
              var resolve,promise=new Promise(res=>resolve=res);
              
              var id      = window.crypto.randomUUID();
              
              var timer;
              if(time!==null){
                    timer   = setTimeout(timeout,time);
              }
              
              window.addEventListener('message',response);
              window.postMessage({from,id,action,payload},'*');
              
              return promise;
              
              
              function response(event){
              
                    if(event.source===window && event.data && event.data.from===ext_from && event.data.id===id){
                                                                                console.log(event);
                          if(timer===null){
                                                                                console.error('timeout miss',event.data);
                                return;
                          }
                          
                          clearTimeout(timer);
                          window.removeEventListener('message',response);
                          resolve(event.data.payload);
                    }
                    
              }//response
              
              
              function timeout(){
              
                    timer       = null;
                    var error   = 'timeout';
                    resolve({error});
                    
              }//timeout
              
        }//send.ext

        send.server   = async function({name,mode,body},time=null){
        
              if(typeof arguments[0]=='string'){
                    mode      = arguments[0];
              }
              
              var ctrl        = new AbortController();
              var {signal}    = ctrl;
              if(time){
                    signal    = AbortSignal.timeout(time)
              }
              
              var server_url    = input.server.value;
              var url           = server_url;
              if(name){
                    url      +=name;
              }
              var method      = 'get';
              if(body){
                    method    = 'post';
              }
              
              var res;
              var error;
              var err;
              
              try{
              
                    res   = await fetch(url,{headers:{auth,mode},method,body,signal});
                    
              }//try
              catch(err2){
              
                    err   = err2;
                    
              }//catch
              
              if(err){
                                                                                console.error(err);
                    if(err.name=='TimeoutError'){
                          error   = 'timeout';
                          return {error};
                    }
                    error   = err.message;
                    return {error};
              }
              if(!res.ok){
                    error       = await res.text();
                    return {error};
              }
              
              var blob    = await res.blob();
              return {blob};
              
        }//server

        async function file_hash(url) {
        
              var buf     = new TextEncoder().encode(url);
              var hash    = await crypto.subtle.digest('SHA-256',buf);
              var uint8   = new Uint8Array(hash);
              var hex     = uint8.toHex().slice(0,10);
              return hex;
              
        }//file_hash
        
        
        async function get(url){
        
              var res;
              var err;
              try{
              
              
                    res         = await fetch(url,{cache:'no-store'});
                    
              }//try
              catch(err2){
              
                    err         = err2;
                    
              }//catch
              if(err){
                                                                                console.error(err);
                    var error   = `Error: ${err.message}`;
                    log.error(error);
                    return {error};
              }
              if(!res.ok){
                    var txt     = await res.text();
                    var error   = `Network response failed : ${txt}`;
                    log.error(error);
                    return {error};
              }
              
              var blob          = await res.blob();
              return {blob};
              
        }//get

              var uint32    = new Uint32Array(1);
              self.crypto.getRandomValues(uint32);
                                                                                //  keep values bound
              var int       = (uint32[0]%100_000)+1;
              return int;
              
        }//new_id

        function hs(size){
        
              size    = Number(size);
              var i   = size==0 ? 0 : Math.floor(Math.log(size)/Math.log(1000));
              var s   = ((size/Math.pow(1000,i)).toFixed(2))*1+' '+['B','kB','MB','GB','TB'][i];
              return s;
              
        }//hs
